# Nginx does two jobs:
#  1. Serves the static web page (index.html).
#  2. Acts as a reverse proxy: anything under /api/ is forwarded to the
#     Search Service. The browser only ever talks to ONE address, so there
#     are no CORS problems, and the Search Service never needs to be public.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        # "search-service" is resolved by Docker / Kubernetes DNS (service discovery).
        # In Kubernetes this name points to a Service that load-balances
        # across ALL Search Service pods.
        proxy_pass http://search-service:8002/;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Reservations and the coordinator-cluster view go to the Inventory Service
    # (load-balanced across its replicas by the Kubernetes Service).
    location = /inventory/reserve {
        proxy_pass http://inventory-service:8001/reserve;
        proxy_read_timeout 20s;
    }
    location = /inventory/cluster {
        proxy_pass http://inventory-service:8001/cluster;
    }

    # Pharmacies send stock updates through this path.
    location = /pharmacy/stock {
        proxy_pass http://pharmacy-service:8003/stock;
    }
}

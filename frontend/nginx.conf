# Nginx does two jobs:
#  1. Serves the web pages: index.html (find medicine), pharmacy.html
#     (pharmacy portal) and system.html (live system view).
#  2. Acts as a reverse proxy, forwarding API paths to the right service.
#     The browser only ever talks to ONE address, so there are no CORS
#     problems, and the services never need to be public.
#
# Service names ("search-service", ...) are resolved by Docker / Kubernetes DNS
# (service discovery). In Kubernetes each name points to a Service that
# load-balances across ALL pods of that service.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Search Service (public search API, pod list)
    location /api/ {
        proxy_pass http://search-service:8002/;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Inventory Service: reservations, coordinator view, activity feed, pharmacy data
    location = /inventory/reserve {
        proxy_pass http://inventory-service:8001/reserve;
        proxy_read_timeout 20s;
    }
    location = /inventory/cluster {
        proxy_pass http://inventory-service:8001/cluster;
    }
    location = /inventory/activity {
        proxy_pass http://inventory-service:8001/activity;
    }
    location /inventory/pharmacies {
        proxy_pass http://inventory-service:8001/pharmacies;
    }

    # Pharmacy Service: pharmacies send stock updates; queue numbers for the system view
    location = /pharmacy/stock {
        proxy_pass http://pharmacy-service:8003/stock;
    }
    location = /pharmacy/queue {
        proxy_pass http://pharmacy-service:8003/queue;
    }
}

# RabbitMQ message broker (with its web dashboard on port 15672).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: medifind
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - { containerPort: 5672, name: amqp }
            - { containerPort: 15672, name: dashboard }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { configMapKeyRef: { name: medifind-config, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: medifind-secret, key: RABBITMQ_PASSWORD } }
          readinessProbe:
            tcpSocket: { port: 5672 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: medifind
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: dashboard, port: 15672, targetPort: 15672 }
